name: Build Flutter APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: 'stable'
      - run: flutter pub get
        working-directory: try2
      - run: flutter build apk --release
        working-directory: try2
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: try2/build/app/outputs/flutter-apk/app-release.apk
